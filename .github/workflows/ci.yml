name: CI

# Lightweight quality gate (plan §11.4): install deps → unit tests → compile
# check → simulation smoke test, plus the React lint/build, a secret scan and
# the **firmware build** (added 2026-10: `firmware/` was previously not compiled
# by CI at all, so "does the sketch even build?" was unknown rather than known).
# Deliberately kept minimal so environment friction does not push developers to
# bypass the gate; heavier steps (coverage thresholds, OpenAPI diff) are added later.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests & simulation smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit & contract tests
        run: python -m pytest tests -q

      - name: Compile check (catch syntax / import errors)
        run: python -m compileall -q energy_system main.py api_server.py dashboard.py

      - name: Simulation smoke test (deterministic regression)
        run: python -m energy_system.simulation.compare

  frontend:
    name: React lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # G6：前端此前零测试，而下一步要批量删除不可达的 ui/ 脚手架（约 61% 的 src）——
      # 没有测试网就动刀是赌博。这里把 vitest 变成阻塞门禁。
      - name: Unit tests (vitest)
        run: npm test

      - name: Build (typecheck + bundle)
        run: npm run build

  secret-scan:
    name: Secret & sensitive-file scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  firmware-build:
    name: Firmware build (ESP32-S3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2

      # 缓存体积大(数百 MB)且与源码无关, 只随"钉扎版本"变化 —— 不要用源码哈希做 key。
      - name: Cache Arduino core & libraries
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-esp32-3.3.7-pubsubclient-v1

      - name: Install ESP32 core and libraries
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.7
          # USE_MQTT 在 config.h 中是硬定义(第 66 行), 故 PubSubClient 是硬依赖;
          # 其余传感器库(DHT/SGP30/ILI9341/INA219/XPT2046)都由 __has_include 保护,
          # 缺失时自动降级, 因此这里**故意不装**, 以便同时守住"缺库也能编译"这个性质。
          arduino-cli lib install PubSubClient

      - name: Compile sketch
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32s3 \
            firmware/esp32_s3_competition
